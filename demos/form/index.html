<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="http://localhost:8080" method="post">
        <label for="firstname">Nom:</label>
        <input type="text" name="firstname" id="firstname" placeholder="Nom"
            minlength="2" maxlength="50"
            required pattern="[a-z]{2,}"
        >
        <label for="email">Email</label>
        <input type="email" name="email" id="email" placeholder="Email"
            pattern="^((?!\.)[\w\-_.]*[^.])(@\w+)(\.\w+(\.\w+)?[^.\W])$">
        <input type="password" name="password" placeholder="password" minlength="16" maxlength="36">
        <input type="number" name="age" placeholder="Age" min="18" max="120">
        <input type="submit" value="Envoyer">
    </form>
</body>
</html>
